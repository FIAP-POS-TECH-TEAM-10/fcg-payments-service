apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secret
  namespace: fcgames
type: Opaque
stringData:
  # Só para o cluster LOCAL (Kind/Docker Desktop) — valor de exemplo, troque. No EKS a
  # chave vem do Secret fcg-jwt gerado pelo Terraform (fcg-orchestration/infra/eks).
  jwt-key: "troque-em-dev-chave-local-com-pelo-menos-32-caracteres"
  db-connection: "Data Source=/data/payments.db"
  rabbitmq-username: "guest"
  rabbitmq-password: "guest"
